<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce Portal | Prabin Raj Dhungana</title>
    <meta name="description" content="Production-ready ecommerce shopping portal built for DevOps project.">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <nav>
        <div class="logo-container" style="display: flex; align-items: center; gap: 10px;">
            <div class="logo" onclick="navigateTo('/')" style="cursor: pointer;">ShopPortal</div>
            <span
                style="background: var(--primary); color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem;">By
                Prabin Raj Dhungana (078BEI026)</span>
        </div>

        <div id="guest-links" class="nav-links">
            <a href="#" onclick="navigateTo('/')">Products</a>
            <a href="#" onclick="navigateTo('/login')" class="btn btn-primary">Login</a>
        </div>

        <div id="auth-links" class="nav-links hidden">
            <a href="#" onclick="navigateTo('/')">Products</a>
            <a href="#" onclick="navigateTo('/cart')">Cart</a>
            <a href="#" onclick="navigateTo('/orders')">Orders</a>
            <a href="#" onclick="navigateTo('/profile')">Hi, <span id="username-display">User</span></a>
            <button class="btn btn-outline" onclick="logout()">Logout</button>
        </div>
    </nav>

    <main class="container" id="main-content">
        <!-- Content injected by app.js -->
    </main>

    <footer style="text-align: center; padding: 2rem; border-top: 1px solid var(--border); margin-top: 4rem;">
        <p class="text-muted">&copy; 2024 Ecommerce Portal - Prabin Raj Dhungana (078BEI026)</p>
    </footer>

    <script src="/js/app.js"></script>
</body>

</html>
